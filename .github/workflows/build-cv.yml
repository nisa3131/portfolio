name: Refresh portfolio CV PDF
on:
  push:
    branches: [main]
    paths:
      - generate_cv.py
      - photo.jpg
      - .github/workflows/build-cv.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install reportlab
      - run: python generate_cv.py
      - name: Commit updated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nusrat_Tabassum_Nisa_CV.pdf
          git diff --cached --quiet || (git commit -m "Publish corrected CV with full photo and faculty reference" && git push)
